spring.application.name=employee-command-service

# Database (Command DB)
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_read_db
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Resilience4j
resilience4j.retry.instances.employeecontroller.base-config=default
resilience4j.circuitbreaker.instances.employeecontroller.base-config=default



# grpc
spring.grpc.server.port=9091